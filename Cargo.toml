[workspace]
resolver = "3"
members = [
    "crates/a0-diag",
    "crates/a0-ir",
    "crates/a0-runtime",
    "crates/a0-interp",
    "crates/a0-target",
    "crates/a0-native",
    "crates/a0-syntax",
    "crates/a0-sema",
    "crates/a0-hir",
    "crates/a0-build",
    "crates/a0-driver",
    "examples/kaleidoscope",
    "examples/lox",
    "examples/minnow",
    "crates/a0",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Dan-k391/a0"

[workspace.dependencies]
a0-diag = { path = "crates/a0-diag" }
a0-ir = { path = "crates/a0-ir" }
a0-runtime = { path = "crates/a0-runtime" }
a0-interp = { path = "crates/a0-interp" }
a0-target = { path = "crates/a0-target" }
a0-native = { path = "crates/a0-native" }
a0-syntax = { path = "crates/a0-syntax" }
a0-sema = { path = "crates/a0-sema" }
a0-hir = { path = "crates/a0-hir" }
a0-build = { path = "crates/a0-build" }
a0-driver = { path = "crates/a0-driver" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
