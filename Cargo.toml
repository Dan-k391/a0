[workspace]
resolver = "3"
members = [
    "crates/a0-diag",
    "crates/a0-ir",
    "crates/a0-runtime",
    "crates/a0-interp",
    "crates/a0-wasm",
    "crates/a0-target",
    "crates/a0-native",
    "crates/a0-syntax",
    "crates/a0-sema",
    "crates/a0-hir",
    "crates/a0-build",
    "crates/a0-driver",
    "crates/a0-capi",
    "crates/a0-playground",
    "examples/kaleidoscope",
    "examples/lox",
    "examples/minnow",
    "b0",
    "examples/tin",
    "crates/a0",
]

[workspace.package]
version = "1.0.1"
edition = "2024"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/Dan-k391/a0"
homepage = "https://github.com/Dan-k391/a0"
keywords = ["compiler", "language", "jit", "cranelift", "interpreter"]
categories = ["compilers", "development-tools"]

[workspace.dependencies]
a0-diag = { path = "crates/a0-diag", version = "=1.0.1" }
a0-ir = { path = "crates/a0-ir", version = "=1.0.1" }
a0-runtime = { path = "crates/a0-runtime", version = "=1.0.1" }
a0-interp = { path = "crates/a0-interp", version = "=1.0.1" }
a0-wasm = { path = "crates/a0-wasm", version = "=1.0.1" }
a0-target = { path = "crates/a0-target", version = "=1.0.1" }
a0-native = { path = "crates/a0-native", version = "=1.0.1" }
a0-syntax = { path = "crates/a0-syntax", version = "=1.0.1" }
a0-sema = { path = "crates/a0-sema", version = "=1.0.1" }
a0-hir = { path = "crates/a0-hir", version = "=1.0.1" }
a0-build = { path = "crates/a0-build", version = "=1.0.1" }
a0-driver = { path = "crates/a0-driver", version = "=1.0.1" }
a0-capi = { path = "crates/a0-capi", version = "=1.0.1" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# A copy of cranelift-object with the COFF relocations aarch64-windows needs (vendor/README.md).
[patch.crates-io]
cranelift-object = { path = "vendor/cranelift-object" }
