# Builds A0 and runs every test, including native executables linked by the system linker, on each
# supported host. aarch64-windows is out of scope.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # x86-64 Linux, aarch64 Linux, aarch64 macOS, x86-64 Windows (MSVC).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-
      - name: Install gdb
        # The test of native debug information drives the platform's debugger (lldb on macOS).
        if: runner.os == 'Linux'
        run: command -v gdb || (sudo apt-get update -qq && sudo apt-get install -y -qq gdb)
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        shell: bash
        run: cargo test --workspace --locked 2>&1 | tee test.log; exit ${PIPESTATUS[0]}
      - name: Report failures
        # As annotations, which can be read without access to the logs.
        if: failure()
        shell: bash
        run: |
          $(command -v python3 || command -v python) - <<'EOF'
          import re
          log = open("test.log", encoding="utf-8", errors="replace").read()
          blocks = re.findall(r"---- (\S+) stdout ----\n(.*?)(?=\n---- |\nfailures:)", log, re.S)
          # A test binary that crashed has no block: the end of the log says what happened.
          blocks = blocks or [("the end of the log", "\n".join(log.splitlines()[-80:]))]
          for name, text in blocks[:10]:
              text = text[-6000:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title={name}::{text}")
          EOF

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ hashFiles('Cargo.lock') }}
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The browser playground: A0's engine (crates/a0-playground) built for WebAssembly with wasi-sdk,
  # then run by Node the way the page runs it. pages.yml publishes it.
  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --target wasm32-wasip1 && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/wasi-sdk
            target
          key: playground-wasi-sdk-34-${{ hashFiles('Cargo.lock') }}
          restore-keys: playground-wasi-sdk-34-
      - name: Install wasi-sdk
        run: |
          if [ ! -x ~/wasi-sdk/bin/clang ]; then
            curl -sSL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz | tar xz -C ~
            mv ~/wasi-sdk-34.0-x86_64-linux ~/wasi-sdk
          fi
      - name: Build
        run: WASI_SDK=$HOME/wasi-sdk sh playground/build.sh
      - name: Test
        run: node playground/test.mjs target/playground
